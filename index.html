<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2-back Task</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;margin-top:50px}
#letter{font-size:80px;width:120px;height:120px;margin:30px auto 16px;display:flex;align-items:center;justify-content:center;line-height:1}
.fixation{color:white;background:gray;border-radius:10px}
#status{min-height:64px;font-size:20px}#countdown{font-size:42px;font-weight:bold;min-height:50px}#instruction{font-size:18px}
#audioUnlock{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:white;color:#111;user-select:none}
#audioUnlockText{font-size:24px;font-weight:bold;padding:24px}
</style>
</head>
<body>
<div id="audioUnlock" aria-live="polite"><div id="audioUnlockText">Enterキーを押して待機を開始してください</div></div>
<h2>2-back</h2>
<div id="game"><div id="letter">✖</div><div id="status"><div id="countdown"></div><div id="instruction">開始まで注視点を見て待機してください</div></div></div>
<script>
'use strict';
const TOTAL_STIMULI=226,TARGETS_PER_HALF=28,TOTAL_TARGETS=56,BLOCK_SIZE=28;
const LETTER_DURATION=500,FIXATION_DURATION=2000,RESPONSE_WINDOW=2500;
const PREPARATION_DURATION=30000,COUNTDOWN_DURATION=5000;
const BASE_LETTERS=["B","F","K","H","M","Q","R","T"];
const RESULT_CODES={EARLY_MISS:1,HIT:2,NO_RESPONSE_MISS:3,EARLY_FA:4,VALID_FA:5,CR:6,DUPLICATE:7};
const CODE_TABLE=[
 [1,"Miss（早期）"],[2,"Hit（有効）"],[3,"Miss（無反応）"],[4,"FA（早期）"],
 [5,"FA（有効）"],[6,"CR（無反応）"],[7,"対象外（重複）"]
];
const audioUnlockDiv=document.getElementById("audioUnlock"),letterDiv=document.getElementById("letter"),countdownDiv=document.getElementById("countdown"),instructionDiv=document.getElementById("instruction");
let isRunning=false,preparationStarted=false,stimulusIndex=0,fullSequence=[],shownSequence=[],logs=[],currentResponses=[];
let trialStartTime=null,testStartTime=null,testEndTime=null,stimulusTimer=null,fixationTimer=null,countdownInterval=null,countdownStartTimer=null,taskStartTimer=null,audioContext=null;
function showFixation(){letterDiv.textContent="✖";letterDiv.classList.add("fixation")}
function showStimulus(letter){letterDiv.textContent=letter;letterDiv.classList.remove("fixation")}
function getAudioContext(){if(!audioContext){const C=window.AudioContext||window.webkitAudioContext;if(C)audioContext=new C()}return audioContext}
async function playTone(frequency,durationMs,volume=.22){try{const c=getAudioContext();if(!c)return false;if(c.state!=="running")await c.resume();const o=c.createOscillator(),g=c.createGain(),n=c.currentTime,d=durationMs/1000,a=Math.min(.08,d*.25),r=Math.min(.22,d*.45);o.type="sine";o.frequency.setValueAtTime(frequency,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(volume,n+a);g.gain.setValueAtTime(volume,n+Math.max(a,d-r));g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d);return true}catch(e){console.error(e);return false}}
function beginPreparation(){
 if(preparationStarted)return;preparationStarted=true;
 const begun=performance.now();audioUnlockDiv.style.display="none";showFixation();countdownDiv.textContent="";instructionDiv.textContent="開始まで注視点を見て待機してください";
 countdownStartTimer=setTimeout(startCountdown,Math.max(0,PREPARATION_DURATION-COUNTDOWN_DURATION-(performance.now()-begun)));
 taskStartTimer=setTimeout(startGame,Math.max(0,PREPARATION_DURATION-(performance.now()-begun)));
 try{const c=getAudioContext();if(c){if(c.state!=="running")void c.resume();const o=c.createOscillator(),g=c.createGain();g.gain.setValueAtTime(.0001,c.currentTime);o.connect(g);g.connect(c.destination);o.start(c.currentTime);o.stop(c.currentTime+.02)}}catch(e){console.warn(e)}
 requestAnimationFrame(()=>setTimeout(()=>{try{fullSequence=generateSequence()}catch(e){clearTimeout(countdownStartTimer);clearTimeout(taskStartTimer);instructionDiv.textContent="刺激列を生成できませんでした。ページを再読み込みしてください。";console.error(e)}},0));
}
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.repeat||preparationStarted)return;e.preventDefault();beginPreparation()});
function startCountdown(){void playTone(659.25,500,.20);instructionDiv.textContent="";let n=5;countdownDiv.textContent=n;countdownInterval=setInterval(()=>{n--;countdownDiv.textContent=n>0?n:"";if(n<=0)clearInterval(countdownInterval)},1000)}
function startGame(){
 if(fullSequence.length!==TOTAL_STIMULI){clearInterval(countdownInterval);countdownDiv.textContent="";instructionDiv.textContent="刺激列の準備が完了していません。ページを再読み込みしてください。";return}
 clearInterval(countdownInterval);countdownDiv.textContent="";instructionDiv.textContent="2つ前の文字と一致時はEnterキーを押す";void playTone(880,600,.22);
 isRunning=true;stimulusIndex=0;shownSequence=[];logs=[];currentResponses=[];trialStartTime=null;testStartTime=new Date();showFixation();
 fixationTimer=setTimeout(()=>{if(isRunning)nextTrial()},FIXATION_DURATION);
}
function nextTrial(){
 if(!isRunning)return;if(stimulusIndex>=TOTAL_STIMULI){endGame();return}
 currentResponses=[];const letter=fullSequence[stimulusIndex];shownSequence.push(letter);showStimulus(letter);trialStartTime=performance.now();stimulusIndex++;
 stimulusTimer=setTimeout(()=>{if(!isRunning)return;showFixation();fixationTimer=setTimeout(()=>{if(!isRunning)return;evaluateTrial();trialStartTime=null;nextTrial()},FIXATION_DURATION)},LETTER_DURATION)
}
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.repeat||!isRunning||trialStartTime===null)return;const rt=Math.round(performance.now()-trialStartTime);if(rt>=0&&rt<RESPONSE_WINDOW)currentResponses.push(rt)});
function generateSequence(){const targets=generateTargetPositions(),seq=[];for(let i=0;i<TOTAL_STIMULI;i++){let b;if(i<2)b=randomChoice(BASE_LETTERS);else if(targets.has(i))b=seq[i-2].toUpperCase();else{const f=seq[i-2].toUpperCase();b=randomChoice(BASE_LETTERS.filter(x=>x!==f))}seq.push(Math.random()<.5?b.toLowerCase():b)}verifySequence(seq);return seq}
function generateTargetPositions(){for(let a=0;a<100000;a++){const t=[...generateHalfTargets(2),...generateHalfTargets(114)].sort((x,y)=>x-y);if(validateTargets(t))return new Set(t)}throw new Error("ターゲット配置の生成上限に達しました。")}
function generateHalfTargets(start){const counts=chooseBlockCounts(),p=[];for(let b=0;b<4;b++){const s=start+b*BLOCK_SIZE,c=Array.from({length:BLOCK_SIZE},(_,i)=>s+i);shuffleInPlace(c);p.push(...c.slice(0,counts[b]))}return p}
function chooseBlockCounts(){const c=[];let rem=TARGETS_PER_HALF;for(let i=0;i<3;i++){const left=3-i,min=Math.max(5,rem-left*9),max=Math.min(9,rem-left*5),v=randomInt(min,max);c.push(v);rem-=v}c.push(rem);return shuffleInPlace(c)}
function validateTargets(t){if(t.length!==TOTAL_TARGETS||new Set(t).size!==TOTAL_TARGETS)return false;if(t.filter(p=>p>=2&&p<=113).length!==28||t.filter(p=>p>=114&&p<=225).length!==28)return false;for(let b=0;b<8;b++){const s=2+b*28,e=s+27,n=t.filter(p=>p>=s&&p<=e).length;if(n<5||n>9)return false}if(t[0]-2>=12||225-t[t.length-1]>=12)return false;for(let i=1;i<t.length;i++)if(t[i]-t[i-1]-1>=12)return false;for(let i=2;i<t.length;i++)if(t[i]===t[i-1]+1&&t[i-1]===t[i-2]+1)return false;return true}
function verifySequence(seq){if(seq.length!==TOTAL_STIMULI)throw new Error("刺激数エラー");const t=[];for(let i=2;i<seq.length;i++)if(seq[i].toLowerCase()===seq[i-2].toLowerCase())t.push(i);if(!validateTargets(t))throw new Error("刺激列条件エラー")}
function randomChoice(a){return a[Math.floor(Math.random()*a.length)]}function randomInt(min,max){return min+Math.floor(Math.random()*(max-min+1))}function shuffleInPlace(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function evaluateTrial(){
 if(stimulusIndex<3)return;const trialNo=stimulusIndex-2,current=shownSequence[stimulusIndex-1],back2=shownSequence[stimulusIndex-3],target=current.toLowerCase()===back2.toLowerCase();
 if(currentResponses.length===0){logs.push([trialNo,"",target?RESULT_CODES.NO_RESPONSE_MISS:RESULT_CODES.CR]);return}
 const rt=currentResponses[0],code=target?(rt<=100?RESULT_CODES.EARLY_MISS:RESULT_CODES.HIT):(rt<=100?RESULT_CODES.EARLY_FA:RESULT_CODES.VALID_FA);logs.push([trialNo,rt,code]);
 for(let i=1;i<currentResponses.length;i++)logs.push(["",-currentResponses[i],RESULT_CODES.DUPLICATE]);
}
function endGame(){isRunning=false;trialStartTime=null;clearTimeout(stimulusTimer);clearTimeout(fixationTimer);testEndTime=new Date();letterDiv.textContent="終了";letterDiv.classList.remove("fixation");instructionDiv.textContent="";exportCSV()}
function calculateSummary(){let t=0,n=0;for(let i=2;i<shownSequence.length;i++)shownSequence[i].toLowerCase()===shownSequence[i-2].toLowerCase()?t++:n++;const total=t+n;return{targetCount:t,nonTargetCount:n,targetRate:total?((t/total)*100).toFixed(2):"0.00"}}
function formatTime(d){return[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,"0")).join(":")}
function csvEscape(v){const s=String(v??"");return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function exportCSV(){
 const summary=calculateSummary(),rows=[["trial","RT","ResultCode","Time","Summary",""]],count=Math.max(logs.length,13);
 for(let i=0;i<count;i++){const log=logs[i]??["","",""];let time="",sum="";if(i===0){time=formatTime(testStartTime);sum=`Target=${summary.targetCount}`}else if(i===1){time=formatTime(testEndTime);sum=`NonTarget=${summary.nonTargetCount}`}else if(i===2)sum=`Rate=${summary.targetRate}%`;rows.push([log[0],log[1],log[2],time,sum,""])}
 // Excel上のE6・F6から対応表を記載する（ヘッダー行を1行目として数える）。
 rows[5][4]="Code";
 rows[5][5]="Meaning";
 CODE_TABLE.forEach(([code,meaning],index)=>{
   rows[6+index][4]=code;
   rows[6+index][5]=meaning;
 });
 const csv="\uFEFF"+rows.map(r=>r.map(csvEscape).join(",")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a"),now=new Date();
 const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}_${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}${String(now.getSeconds()).padStart(2,"0")}`;
 link.href=url;link.download=`n-back_${stamp}.csv`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
</script>
</body>
</html>
