<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2-back Task</title>
<style>
body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
#letter { font-size: 80px; width: 120px; height: 120px; margin: 30px auto 16px; display: flex; align-items: center; justify-content: center; line-height: 1; }
.fixation { color: white; background: gray; border-radius: 10px; }
#status { min-height: 64px; font-size: 20px; }
#countdown { font-size: 42px; font-weight: bold; min-height: 50px; }
#instruction { font-size: 18px; }
#audioUnlock {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  color: #111;
  user-select: none;
}
#audioUnlockText {
  font-size: 24px;
  font-weight: bold;
  padding: 24px;
}
</style>
</head>
<body>
<div id="audioUnlock" aria-live="polite">
  <div id="audioUnlockText">Enterキーを押して待機を開始してください</div>
</div>
<h2>2-back</h2>
<div id="game">
  <div id="letter">✖</div>
  <div id="status">
    <div id="countdown"></div>
    <div id="instruction">開始まで注視点を見て待機してください</div>
  </div>
</div>
<script>
'use strict';

const TOTAL_STIMULI = 226;
const TARGETS_PER_HALF = 28;
const TOTAL_TARGETS = 56;
const BLOCK_SIZE = 28;
const LETTER_DURATION = 500;
const FIXATION_DURATION = 2000;
const RESPONSE_WINDOW = LETTER_DURATION + FIXATION_DURATION;
const PREPARATION_DURATION = 30000;
const COUNTDOWN_DURATION = 5000;
const BASE_LETTERS = ["B", "F", "K", "H", "M", "Q", "R", "T"];

const audioUnlockDiv = document.getElementById("audioUnlock");
const letterDiv = document.getElementById("letter");
const countdownDiv = document.getElementById("countdown");
const instructionDiv = document.getElementById("instruction");

let isRunning = false;
let stimulusIndex = 0;
let fullSequence = [];
let shownSequence = [];
let logs = [];
let currentResponses = [];
let trialStartTime = null;
let testStartTime = null;
let testEndTime = null;
let stimulusTimer = null;
let fixationTimer = null;
let countdownInterval = null;
let countdownStartTimer = null;
let taskStartTimer = null;
let audioContext = null;

function showFixation() {
  letterDiv.textContent = "✖";
  letterDiv.classList.add("fixation");
}

function showStimulus(letter) {
  letterDiv.textContent = letter;
  letterDiv.classList.remove("fixation");
}

function getAudioContext() {
  if (!audioContext) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioContext = new AudioContextClass();
  }
  return audioContext;
}

async function playTone(frequency, durationMs, volume = 0.22) {
  try {
    const context = getAudioContext();
    if (!context) throw new Error("Web Audio APIに対応していません。");

    if (context.state !== "running") {
      await context.resume();
    }
    if (context.state !== "running") {
      throw new Error(`AudioContext state: ${context.state}`);
    }

    const oscillator = context.createOscillator();
    const gain = context.createGain();
    const now = context.currentTime;
    const duration = durationMs / 1000;
    const attack = Math.min(0.08, duration * 0.25);
    const release = Math.min(0.22, duration * 0.45);

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(frequency, now);

    // 急に鳴り始めないよう、無音から徐々に音量を上げて滑らかに消す。
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + attack);
    gain.gain.setValueAtTime(volume, now + Math.max(attack, duration - release));
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start(now);
    oscillator.stop(now + duration);
    return true;
  } catch (error) {
    console.error("音声を再生できませんでした。", error);
    return false;
  }
}

let preparationStarted = false;

function beginPreparation() {
  if (preparationStarted) return;
  preparationStarted = true;

  // Enterを押した瞬間に待機画面へ切り替え、30秒計測も直ちに開始する。
  const preparationStart = performance.now();
  audioUnlockDiv.style.display = "none";
  showFixation();
  countdownDiv.textContent = "";
  instructionDiv.textContent = "開始まで注視点を見て待機してください";

  countdownStartTimer = setTimeout(
    startCountdown,
    Math.max(0, PREPARATION_DURATION - COUNTDOWN_DURATION - (performance.now() - preparationStart))
  );
  taskStartTimer = setTimeout(
    startGame,
    Math.max(0, PREPARATION_DURATION - (performance.now() - preparationStart))
  );

  // Enter操作中に音声を有効化する。待機画面の表示やタイマー開始は待たせない。
  try {
    const context = getAudioContext();
    if (context) {
      if (context.state !== "running") void context.resume();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      gain.gain.setValueAtTime(0.0001, context.currentTime);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(context.currentTime);
      oscillator.stop(context.currentTime + 0.02);
    }
  } catch (error) {
    console.warn("音声の初期化に失敗しました。", error);
  }

  // 重い刺激列生成は、待機画面を描画した後に実行する。
  requestAnimationFrame(() => {
    setTimeout(() => {
      try {
        fullSequence = generateSequence();
      } catch (error) {
        clearTimeout(countdownStartTimer);
        clearTimeout(taskStartTimer);
        instructionDiv.textContent = "刺激列を生成できませんでした。ページを再読み込みしてください。";
        console.error(error);
      }
    }, 0);
  });
}

document.addEventListener("keydown", event => {
  if (event.key !== "Enter" || event.repeat || preparationStarted) return;
  event.preventDefault();
  beginPreparation();
});

function startCountdown() {
  void playTone(659.25, 500, 0.20);
  instructionDiv.textContent = "";
  let remaining = 5;
  countdownDiv.textContent = remaining;
  countdownInterval = setInterval(() => {
    remaining--;
    countdownDiv.textContent = remaining > 0 ? remaining : "";
    if (remaining <= 0) clearInterval(countdownInterval);
  }, 1000);
}

function startGame() {
  if (fullSequence.length !== TOTAL_STIMULI) {
    clearInterval(countdownInterval);
    countdownDiv.textContent = "";
    instructionDiv.textContent = "刺激列の準備が完了していません。ページを再読み込みしてください。";
    return;
  }

  clearInterval(countdownInterval);
  countdownDiv.textContent = "";
  instructionDiv.textContent = "2つ前の文字と一致時はEnterキーを押す";
  void playTone(880.00, 600, 0.22);

  isRunning = true;
  stimulusIndex = 0;
  shownSequence = [];
  logs = [];
  currentResponses = [];
  trialStartTime = null;
  testStartTime = new Date();

  // タスク開始音の直後は、まず2000 msの注視点を表示する。
  showFixation();
  fixationTimer = setTimeout(() => {
    if (isRunning) nextTrial();
  }, FIXATION_DURATION);
}

function nextTrial() {
  if (!isRunning) return;
  if (stimulusIndex >= TOTAL_STIMULI) {
    endGame();
    return;
  }

  currentResponses = [];
  const letter = fullSequence[stimulusIndex];
  shownSequence.push(letter);
  showStimulus(letter);
  trialStartTime = performance.now();
  stimulusIndex++;

  stimulusTimer = setTimeout(() => {
    if (!isRunning) return;
    showFixation();
    fixationTimer = setTimeout(() => {
      if (!isRunning) return;
      evaluateTrial();
      trialStartTime = null;
      nextTrial();
    }, FIXATION_DURATION);
  }, LETTER_DURATION);
}

document.addEventListener("keydown", event => {
  if (event.key !== "Enter" || event.repeat || !isRunning || trialStartTime === null) return;
  const rt = Math.round(performance.now() - trialStartTime);
  if (rt >= 0 && rt < RESPONSE_WINDOW) currentResponses.push(rt);
});

function generateSequence() {
  const targetSet = generateTargetPositions();
  const seq = [];
  for (let i = 0; i < TOTAL_STIMULI; i++) {
    let base;
    if (i < 2) {
      base = randomChoice(BASE_LETTERS);
    } else if (targetSet.has(i)) {
      base = seq[i - 2].toUpperCase();
    } else {
      const forbidden = seq[i - 2].toUpperCase();
      base = randomChoice(BASE_LETTERS.filter(letter => letter !== forbidden));
    }
    seq.push(Math.random() < 0.5 ? base.toLowerCase() : base);
  }
  verifySequence(seq);
  return seq;
}

function generateTargetPositions() {
  const MAX_ATTEMPTS = 100000;
  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    const targets = [...generateHalfTargets(2), ...generateHalfTargets(114)].sort((a, b) => a - b);
    if (validateTargets(targets)) return new Set(targets);
  }
  throw new Error("ターゲット配置の生成上限に達しました。");
}

function generateHalfTargets(startIndex) {
  const counts = chooseBlockCounts();
  const positions = [];
  for (let block = 0; block < 4; block++) {
    const blockStart = startIndex + block * BLOCK_SIZE;
    const candidates = Array.from({ length: BLOCK_SIZE }, (_, offset) => blockStart + offset);
    shuffleInPlace(candidates);
    positions.push(...candidates.slice(0, counts[block]));
  }
  return positions;
}

function chooseBlockCounts() {
  const counts = [];
  let remaining = TARGETS_PER_HALF;
  for (let i = 0; i < 3; i++) {
    const blocksLeft = 3 - i;
    const min = Math.max(5, remaining - blocksLeft * 9);
    const max = Math.min(9, remaining - blocksLeft * 5);
    const value = randomInt(min, max);
    counts.push(value);
    remaining -= value;
  }
  counts.push(remaining);
  shuffleInPlace(counts);
  return counts;
}

function validateTargets(targets) {
  if (targets.length !== TOTAL_TARGETS || new Set(targets).size !== TOTAL_TARGETS) return false;
  if (targets.filter(p => p >= 2 && p <= 113).length !== TARGETS_PER_HALF) return false;
  if (targets.filter(p => p >= 114 && p <= 225).length !== TARGETS_PER_HALF) return false;
  for (let block = 0; block < 8; block++) {
    const start = 2 + block * BLOCK_SIZE;
    const end = start + BLOCK_SIZE - 1;
    const count = targets.filter(p => p >= start && p <= end).length;
    if (count < 5 || count > 9) return false;
  }
  if (targets[0] - 2 >= 12) return false;
  for (let i = 1; i < targets.length; i++) {
    if (targets[i] - targets[i - 1] - 1 >= 12) return false;
  }
  for (let i = 2; i < targets.length; i++) {
    if (targets[i] === targets[i - 1] + 1 && targets[i - 1] === targets[i - 2] + 1) return false;
  }
  if (225 - targets[targets.length - 1] >= 12) return false;
  return true;
}

function verifySequence(seq) {
  if (seq.length !== TOTAL_STIMULI) throw new Error("刺激数が226ではありません。");
  const targets = [];
  for (let i = 2; i < seq.length; i++) {
    if (seq[i].toLowerCase() === seq[i - 2].toLowerCase()) targets.push(i);
  }
  if (!validateTargets(targets)) throw new Error("刺激列が配置条件を満たしていません。");
}

function randomChoice(array) { return array[Math.floor(Math.random() * array.length)]; }
function randomInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffleInPlace(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function evaluateTrial() {
  if (stimulusIndex < 3) return;
  const trialNo = stimulusIndex - 2;
  const current = shownSequence[stimulusIndex - 1];
  const back2 = shownSequence[stimulusIndex - 3];
  const isTarget = current.toLowerCase() === back2.toLowerCase();

  if (currentResponses.length === 0) {
    logs.push([trialNo, "", isTarget ? "Miss（無反応）" : "CR（無反応）"]);
    return;
  }

  const firstRt = currentResponses[0];
  const result = isTarget
    ? (firstRt <= 100 ? "Miss（早期）" : "Hit（有効）")
    : (firstRt <= 100 ? "FA（早期）" : "FA（有効）");
  logs.push([trialNo, firstRt, result]);
  for (let i = 1; i < currentResponses.length; i++) {
    logs.push(["", -currentResponses[i], "対象外（重複）"]);
  }
}

function endGame() {
  isRunning = false;
  trialStartTime = null;
  clearTimeout(stimulusTimer);
  clearTimeout(fixationTimer);
  testEndTime = new Date();
  letterDiv.textContent = "終了";
  letterDiv.classList.remove("fixation");
  instructionDiv.textContent = "";
  exportCSV();
}

function calculateSummary() {
  let targetCount = 0;
  let nonTargetCount = 0;
  for (let i = 2; i < shownSequence.length; i++) {
    if (shownSequence[i].toLowerCase() === shownSequence[i - 2].toLowerCase()) targetCount++;
    else nonTargetCount++;
  }
  const total = targetCount + nonTargetCount;
  return { targetCount, nonTargetCount, targetRate: total ? ((targetCount / total) * 100).toFixed(2) : "0.00" };
}

function formatTime(date) {
  return [date.getHours(), date.getMinutes(), date.getSeconds()].map(v => String(v).padStart(2, "0")).join(":");
}
function csvEscape(value) {
  const text = String(value ?? "");
  return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function exportCSV() {
  const summary = calculateSummary();
  const rows = [["trial", "RT", "Result", "Time", "Summary"]];
  const count = Math.max(logs.length, 3);
  for (let i = 0; i < count; i++) {
    const log = logs[i] ?? ["", "", ""];
    let time = "";
    let summaryText = "";
    if (i === 0) { time = formatTime(testStartTime); summaryText = `Target=${summary.targetCount}`; }
    else if (i === 1) { time = formatTime(testEndTime); summaryText = `NonTarget=${summary.nonTargetCount}`; }
    else if (i === 2) { summaryText = `Rate=${summary.targetRate}%`; }
    rows.push([log[0], log[1], log[2], time, summaryText]);
  }
  const csv = "\uFEFF" + rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}_${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}${String(now.getSeconds()).padStart(2,"0")}`;
  link.href = url;
  link.download = `n-back_${stamp}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}


</script>
</body>
</html>
